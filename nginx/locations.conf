# Las rutas del reverse proxy. Las incluyen local.conf (compose, HTTP) y vm.conf.template (VMs, HTTPS),
# así las dos sirven exactamente lo mismo.
#
# nginx solo decide a qué servicio va cada pedido: no balancea. Si un servicio tiene varias réplicas,
# el nombre resuelve a la IP virtual del servicio y Swarm reparte entre ellas.

# El DNS de Docker. Con el destino en una variable, nginx resuelve el nombre en cada pedido (y lo cachea 10s)
# en vez de una sola vez al arrancar: arranca aunque un servicio no esté levantado y sigue al container si cambia de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Los heredan las locations que no definen ninguno. Authorization pasa solo: nginx reenvía los headers del pedido.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Un id por pedido, para seguirlo de punta a punta: sale en el log de nginx, los servicios de Spring lo ponen en
# sus logs y vuelve en la respuesta, así quien reporta un error puede pasarlo. Lo genera siempre nginx y pisa el
# que traiga el pedido: es la puerta de entrada, y un id elegido desde afuera podría repetirse o meter cualquier
# cosa en los logs. Si un servicio también lo devolviera, se oculta el suyo para no mandarlo dos veces.
proxy_set_header X-Request-Id $request_id;
proxy_hide_header X-Request-Id;
add_header X-Request-Id $request_id always;

# Un JSON por pedido, con el id, el status, cuánto tardó y a qué container fue. El formato (snippet_json) está
# definido en local.conf y en vm.conf.template, porque log_format no puede ir dentro de un server.
access_log /var/log/nginx/access.log snippet_json;

# La API: snippet-service, que orquesta al resto. permission-service y language-service no se publican.
# La UI llama a /api/...; snippet-service no tiene ese prefijo, así que se lo saca.
location /api/ {
    set $snippet_service http://snippet-service:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $snippet_service;
    client_max_body_size 1m;
}

# US9 y US10: correr un snippet es un WebSocket. nginx no reenvía solo los headers de Upgrade, y
# mientras el código espera un input no pasa nada por la conexión: sin un timeout largo, nginx la
# cortaría a los 60s. language-service corta la ejecución antes, a los 5 minutos sin input.
location = /api/execution {
    set $snippet_service http://snippet-service:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $snippet_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Los proxy_set_header de arriba no se heredan si la location define alguno.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 10m;
}

# El health check de cada servicio interno, para los monitores sintéticos de New Relic: desde afuera solo se llega
# a snippet-service, y así se sabe cuál se cayó. Solo dicen UP o DOWN (Spring no muestra los detalles sin login).
# El de snippet-service es /api/actuator/health, que también da DOWN si se cae su base o Redis.
location = /health/permission-service {
    set $permission_service http://permission-service:8080;
    proxy_pass $permission_service/actuator/health;
}
location = /health/language-service {
    set $language_service http://language-service:8080;
    proxy_pass $language_service/actuator/health;
}
# El asset-service de la cátedra tiene el actuator en otro puerto.
location = /health/asset-service {
    set $asset_service http://asset-service:9090;
    proxy_pass $asset_service/actuator/health;
}

# Todo lo demás es la UI. Al ser el mismo dominio que la API, el browser no necesita CORS.
location / {
    set $printscript_ui http://printscript-ui:80;
    proxy_pass $printscript_ui;
}
