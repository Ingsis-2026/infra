# El reverse proxy en tu máquina (docker-compose.yml): solo HTTP, sin dominio ni certificado.

# El log de cada pedido, un JSON por línea (lo usa locations.conf). Con escape=json, un valor que no existe queda
# vacío: por eso los del upstream van entre comillas. upstream es el container al que fue el pedido.
log_format snippet_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_tokens off;

    include /etc/nginx/snippet/locations.conf;
}
