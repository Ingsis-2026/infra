# Único punto de entrada de la plataforma.
# La UI queda en /, y /api/ va a snippet-service sin el prefijo (/api/snippets llega como /snippets):
# el servicio no necesita saber bajo qué ruta pública está publicado.
# permission-service y language-service no se exponen; solo los llama snippet-service por la red interna.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    location / {
        proxy_pass http://printscript-ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://snippet-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
