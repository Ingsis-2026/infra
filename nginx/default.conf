# El reverse proxy de Snippet Searcher: la única entrada desde afuera. Como en el ejemplo de la cátedra
# (austral-ingsis/nginx-docker), elige el servicio según el path, y los servicios no publican puertos.
server {
    listen 80;

    # El DNS de Docker, consultado en cada pedido y no solo al arrancar: así nginx levanta aunque la UI o
    # snippet-service todavía no estén, y sigue llegando a ellos si se recrean con otra IP. Por eso
    # proxy_pass usa una variable, y el prefijo /api se saca con rewrite en vez de con la "/" final.
    resolver 127.0.0.11 valid=10s;

    # La API: /api/snippets llega a snippet-service como /snippets.
    location /api/ {
        set $snippet_service http://snippet-service:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $snippet_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Los snippets se suben como archivo (US1, US2).
        client_max_body_size 1m;
    }

    # Todo lo demás es la UI, que resuelve sus propias rutas.
    location / {
        set $printscript_ui http://printscript-ui:80;
        proxy_pass $printscript_ui;
        proxy_set_header Host $host;
        # Si la UI no responde, una página propia en vez de la de nginx. La API no la usa: sus clientes esperan
        # el status, no HTML.
        error_page 502 503 504 /errors/no-disponible.html;
    }

    # Solo para error_page: pedirla directamente es un 404, como en el ejemplo de la cátedra.
    location /errors/ {
        root /usr/share/nginx/html;
        internal;
    }
}
