name: Continuous Integration

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  validate:
    name: Validate Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      # docker stack deploy no lee archivos de variables: las exportamos igual que deploy.sh en la VM.
      - name: Validate docker-stack.yml
        run: |
          set -a
          . ./env/dev.env
          set +a
          export NGINX_CONFIG_VERSION=ci
          docker stack config -c docker-stack.yml > /dev/null

      - name: Lint the scripts
        run: shellcheck deploy.sh certbot.sh

      # nginx -t con la misma imagen y los mismos archivos en los mismos paths que el compose y el stack.
      # La de las VMs necesita un certificado para el 443: uno autofirmado, como el que deja certbot.sh en la VM.
      - name: Validate the nginx config of the compose
        run: >
          docker run --rm
          -v "$PWD/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/nginx/locations.conf:/etc/nginx/snippet/locations.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Validate the nginx config of the VMs
        run: |
          mkdir -p "$RUNNER_TEMP/live/ci.duckdns.org"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=ci.duckdns.org \
            -keyout "$RUNNER_TEMP/live/ci.duckdns.org/privkey.pem" -out "$RUNNER_TEMP/live/ci.duckdns.org/fullchain.pem"
          docker run --rm -e DOMAIN=ci.duckdns.org \
            -v "$PWD/nginx/vm.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/nginx/locations.conf:/etc/nginx/snippet/locations.conf:ro" \
            -v "$RUNNER_TEMP/live:/etc/letsencrypt/live:ro" \
            nginx:1.27-alpine nginx -t
