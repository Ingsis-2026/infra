name: Deploy

# Cada VM tiene un clon de este repo en ~/infra con su propio .env. main despliega a prod y dev a dev.
# Apagado hasta que existan las VMs: se prende con la variable de organización DEPLOY_ENABLED=true
# y los secretos SSH_HOST, SSH_USERNAME y SSH_KEY en los environments "dev" y "prod".
on:
  push:
    branches: [ "main", "dev" ]

jobs:
  deploy:
    name: Deploy to VM
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Pull infra and restart what changed
        uses: appleboy/ssh-action@v1
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH
          script: |
            cd ~/infra
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            docker compose pull
            docker compose up -d --remove-orphans
