name: Deploy

# Corre solo cuando CI terminó bien sobre un push a main o dev. main despliega a prod y dev a dev.
# Cada VM es un Swarm de un nodo sin ninguna configuración propia. A la VM no se copia nada: deploy.sh corre acá,
# en el runner, y su docker le habla al de la VM por SSH con un docker context. Los secretos del environment de
# GitHub llegan a deploy.sh, que la primera vez los guarda como Docker Secrets.
# Apagado hasta que existan las VMs: se prende con la variable DEPLOY_ENABLED=true y, en los environments "dev" y
# "prod", los secretos SSH_HOST, SSH_USERNAME, SSH_KEY, SNIPPET_DB_PASSWORD, PERMISSION_DB_PASSWORD, DUCKDNS_TOKEN,
# AUTH0_M2M_CLIENT_ID, AUTH0_M2M_CLIENT_SECRET y NEW_RELIC_LICENSE_KEY (y la variable opcional LETSENCRYPT_EMAIL).
on:
  workflow_run:
    workflows: [ "Continuous Integration" ]
    types: [ completed ]
    branches: [ "main", "dev" ]

# Un run a la vez por rama: si se mergean varios PRs seguidos, esperan en fila en vez de pisarse.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # Si mientras corría CI llegó otro commit a la rama, este ya quedó viejo: lo despliega el CD de ese commit.
  # Así un run que termina tarde nunca pisa uno más nuevo.
  latest:
    name: Check it is the branch's latest commit
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}

    steps:
      - name: Compare with the branch tip
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TIP=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .commit.sha)
          if [ "$TIP" = "$SHA" ]; then echo "is_latest=true" >> "$GITHUB_OUTPUT"; else echo "is_latest=false" >> "$GITHUB_OUTPUT"; echo "Skipping: $BRANCH is already at ${TIP::8}"; fi

  deploy:
    name: Deploy stack to VM
    needs: latest
    if: vars.DEPLOY_ENABLED == 'true' && needs.latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Un docker context: desde acá, cada comando de docker se ejecuta en el docker de la VM, por SSH (puerto 22).
      # La VM no expone el puerto de la API de docker. El ControlMaster reusa una sola conexión SSH para todos los
      # comandos, en vez de abrir una por cada uno.
      - name: Point docker at the VM over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host $SSH_HOST
            IdentityFile ~/.ssh/id_vm
            IdentitiesOnly yes
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 60s
          EOF
          docker context create vm --docker "host=ssh://$SSH_USERNAME@$SSH_HOST"
          docker context use vm
          # Falla acá, antes del deploy, si no se llega a la VM o si no es manager de un Swarm.
          docker node ls

      # Corre en el runner contra el docker de la VM. Los secretos viajan por esa conexión y quedan solo en Swarm.
      - name: Deploy the stack
        env:
          TARGET: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}
          SNIPPET_DB_PASSWORD: ${{ secrets.SNIPPET_DB_PASSWORD }}
          PERMISSION_DB_PASSWORD: ${{ secrets.PERMISSION_DB_PASSWORD }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: sh deploy.sh "$TARGET"
