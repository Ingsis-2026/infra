name: Deploy

# Corre solo cuando CI terminó bien sobre un push a main o dev. main despliega a prod y dev a dev.
# Cada VM es un Swarm de un nodo con su propio .env en ~/snippet-searcher; acá solo copiamos el stack y lo aplicamos.
# Apagado hasta que existan las VMs: se prende con la variable DEPLOY_ENABLED=true
# y los secretos SSH_HOST, SSH_USERNAME y SSH_KEY en los environments "dev" y "prod".
on:
  workflow_run:
    workflows: [ "Continuous Integration" ]
    types: [ completed ]
    branches: [ "main", "dev" ]

# Un run a la vez por rama: si se mergean varios PRs seguidos, esperan en fila en vez de pisarse.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # Si mientras corría CI llegó otro commit a la rama, este ya quedó viejo: lo despliega el CD de ese commit.
  # Así un run que termina tarde nunca pisa uno más nuevo.
  latest:
    name: Check it is the branch's latest commit
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}

    steps:
      - name: Compare with the branch tip
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TIP=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .commit.sha)
          if [ "$TIP" = "$SHA" ]; then echo "is_latest=true" >> "$GITHUB_OUTPUT"; else echo "is_latest=false" >> "$GITHUB_OUTPUT"; echo "Skipping: $BRANCH is already at ${TIP::8}"; fi

  deploy:
    name: Deploy stack to VM
    needs: latest
    if: vars.DEPLOY_ENABLED == 'true' && needs.latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy the stack to the VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-stack.yml,deploy.sh"
          target: "~/snippet-searcher"

      - name: Deploy the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: sh ~/snippet-searcher/deploy.sh
