# Snippet Searcher en Docker Swarm: el mismo sistema que docker-compose.yml, pero para las VMs.
# Se despliega con deploy.sh, que carga el .env de la VM (docker stack deploy no lo lee solo).
# Diferencias con el compose: sin depends_on ni restart (Swarm reinicia lo que falla con restart_policy),
# el único que publica puertos es el reverse proxy (80 y 443, con HTTPS) y DuckDNS mantiene el dominio apuntando a la VM.

x-service-deploy: &service-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
  # Levanta la tarea nueva antes de bajar la vieja; si la nueva no arranca, vuelve a la imagen anterior.
  update_config:
    order: start-first
    monitor: 60s
    failure_action: rollback
  resources:
    limits:
      memory: 768M

x-db-deploy: &db-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
  # Los volúmenes son locales al nodo: la base tiene que correr siempre en el mismo.
  placement:
    constraints: [ node.role == manager ]
  resources:
    limits:
      memory: 512M

# Para los containers livianos: el proxy, la UI (archivos estáticos) y DuckDNS.
x-light-deploy: &light-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
  update_config:
    order: start-first
    failure_action: rollback
  resources:
    limits:
      memory: 128M

services:

  # Reverse proxy: el único que publica puertos. Por el 80 solo valida Let's Encrypt (lo demás va a HTTPS);
  # por el 443 sirve la UI en / y snippet-service en /api. Las rutas están en nginx/locations.conf.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DUCKDNS_SUBDOMAIN}.duckdns.org
    # Los configs de Swarm meten cada archivo en el container, en el path de "target".
    configs:
      - source: nginx-server
        target: /etc/nginx/templates/default.conf.template
      - source: nginx-locations
        target: /etc/nginx/snippet/locations.conf
    # El certificado lo escribe certbot.sh (un container de certbot que corre una vez), nginx solo lo lee.
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-challenge:/var/www/certbot
    networks: [ snippet-net ]
    deploy:
      <<: *light-deploy
      # Los certificados están en un volumen local al nodo, como las bases.
      placement:
        constraints: [ node.role == manager ]

  # Mantiene <DUCKDNS_SUBDOMAIN>.duckdns.org apuntando a la IP pública de esta VM: la avisa cada 5 minutos.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: America/Argentina/Buenos_Aires
    deploy: *light-deploy

  # La UI: su imagen es un nginx que sirve los archivos estáticos. No publica puertos: se llega por el proxy.
  printscript-ui:
    image: ghcr.io/ingsis-2026/printscript-ui:${IMAGE_TAG}
    networks: [ snippet-net ]
    deploy: *light-deploy

  snippet-service:
    image: ghcr.io/ingsis-2026/snippet-service:${IMAGE_TAG}
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_HOST: snippet-db
      DB_PORT: 5432
      DB_NAME: ${SNIPPET_DB_NAME}
      DB_USER: ${SNIPPET_DB_USER}
      DB_PASSWORD: ${SNIPPET_DB_PASSWORD}
      PERMISSION_URL: http://permission-service:8080
      LANGUAGE_URL: http://language-service:8080
      ASSET_URL: http://asset-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # La aplicación machine-to-machine de Auth0 para buscar con quién compartir (US7). Salen del .env.
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID:-}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET:-}
    networks: [ snippet-net ]
    deploy: *service-deploy

  snippet-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SNIPPET_DB_NAME}
      POSTGRES_USER: ${SNIPPET_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPET_DB_PASSWORD}
    volumes:
      - snippet-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ snippet-net ]
    deploy: *db-deploy

  # El asset-service de la cátedra: guarda el código de los snippets en Azurite. Sin "ports": no
  # tiene autenticación, así que solo se llega desde snippet-net. Su imagen solo tiene latest.
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:latest
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      AZURE_HOST: http://azurite
      NEW_RELIC_AGENT_ENABLED: "false"
    networks: [ snippet-net ]
    deploy: *service-deploy

  # Donde asset-service guarda el código de los snippets. Sin "ports": solo se llega desde snippet-net,
  # como a las bases.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    volumes:
      - azurite-data:/data
    networks: [ snippet-net ]
    deploy: *db-deploy

  # La cola de snippets a lintear (US15). Sin "ports", como las bases; con AOF y en el manager,
  # porque lo encolado vive en un volumen local al nodo.
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [ snippet-net ]
    deploy: *db-deploy

  permission-service:
    image: ghcr.io/ingsis-2026/permission-service:${IMAGE_TAG}
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: 8080
      DB_HOST: permission-db
      DB_PORT: 5432
      DB_NAME: ${PERMISSION_DB_NAME}
      DB_USER: ${PERMISSION_DB_USER}
      DB_PASSWORD: ${PERMISSION_DB_PASSWORD}
    networks: [ snippet-net ]
    deploy: *service-deploy

  permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PERMISSION_DB_NAME}
      POSTGRES_USER: ${PERMISSION_DB_USER}
      POSTGRES_PASSWORD: ${PERMISSION_DB_PASSWORD}
    volumes:
      - permission-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ snippet-net ]
    deploy: *db-deploy

  language-service:
    image: ghcr.io/ingsis-2026/language-service:${IMAGE_TAG}
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: 8080
    networks: [ snippet-net ]
    deploy: *service-deploy

networks:
  snippet-net:
    driver: overlay

# Un config no se puede modificar: deploy.sh pone en NGINX_CONFIG_VERSION un hash de nginx/, así cada cambio es un config nuevo.
configs:
  nginx-server:
    name: snippet-nginx-server-${NGINX_CONFIG_VERSION}
    file: ./nginx/vm.conf.template
  nginx-locations:
    name: snippet-nginx-locations-${NGINX_CONFIG_VERSION}
    file: ./nginx/locations.conf

volumes:
  snippet-data:
  permission-data:
  azurite-data:
  redis-data:
  # Los certificados de Let's Encrypt (los escribe certbot.sh, los lee nginx).
  letsencrypt:
  # Donde certbot.sh deja el archivo que Let's Encrypt viene a buscar por el puerto 80.
  acme-challenge:
