# Snippet Searcher: el reverse proxy, la UI, todos los servicios, sus bases de datos, el asset-service de la cátedra, Azurite y Redis
# en un solo compose. Las imágenes de los servicios las publica el CD de cada repo en ghcr.io/ingsis-2026, a partir de su Dockerfile.
# IMAGE_TAG (en el .env) elige cuáles se levantan: dev o prod. Si un puerto ya está ocupado en tu máquina, cambialo en el .env.
# En tu máquina cada servicio publica además su puerto, para probarlo o correrlo desde el IDE; en las VMs, solo el proxy.

services:

  # Reverse proxy, con las mismas rutas que en las VMs (nginx/locations.conf) pero solo HTTP:
  # la UI en http://localhost y snippet-service en http://localhost/api.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/snippet/locations.conf:ro
    restart: unless-stopped

  # La UI: su imagen es un nginx que sirve los archivos estáticos.
  printscript-ui:
    image: ghcr.io/ingsis-2026/printscript-ui:${IMAGE_TAG}
    restart: unless-stopped

  snippet-service:
    image: ghcr.io/ingsis-2026/snippet-service:${IMAGE_TAG}
    ports:
      - "${SNIPPET_SERVICE_PORT:-8080}:8080"
    environment:
      DB_HOST: snippet-db
      DB_PORT: 5432
      DB_NAME: ${SNIPPET_DB_NAME}
      DB_USER: ${SNIPPET_DB_USER}
      DB_PASSWORD: ${SNIPPET_DB_PASSWORD}
      PERMISSION_URL: http://permission-service:8080
      LANGUAGE_URL: http://language-service:8080
      ASSET_URL: http://asset-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # La aplicación machine-to-machine de Auth0 para buscar con quién compartir (US7). Salen del .env.
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID:-}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET:-}
    depends_on:
      snippet-db:
        condition: service_healthy
      asset-service:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  snippet-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SNIPPET_DB_NAME}
      POSTGRES_USER: ${SNIPPET_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPET_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - snippet-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # El asset-service de la cátedra: guarda el código de los snippets en Azurite. snippet-service le
  # habla por HTTP y es el único que habla con Azurite. Escucha en el 8080; su health está en el 9090.
  # La imagen no es nuestra: la publica austral-ingsis, sin versiones ni tags dev/prod. Cada build es un tag
  # main.<número>; la misma que en docker-stack.yml.
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:main.18
    ports:
      - "${ASSET_SERVICE_PORT:-8083}:8080"
    environment:
      AZURE_HOST: http://azurite
      # La imagen arranca con el agente de New Relic; sin licencia, apagado.
      NEW_RELIC_AGENT_ENABLED: "false"
    depends_on:
      azurite:
        condition: service_started
    restart: unless-stopped

  # Emulador de Azure Blob Storage: ahí guarda asset-service el código de los snippets. Solo el
  # servicio de blobs, escuchando en 0.0.0.0 para que se llegue desde los otros containers.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    # Los mismos healthchecks que en docker-stack.yml: docker compose ps muestra si Azurite y Redis están listos.
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Las colas de snippets a lintear (US15) y a formatear (US12): dos streams que escribe y lee snippet-service.
  # Con AOF, para que lo encolado y todavía no procesado sobreviva a un reinicio.
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  permission-service:
    image: ghcr.io/ingsis-2026/permission-service:${IMAGE_TAG}
    ports:
      - "${PERMISSION_SERVICE_PORT:-8081}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: permission-db
      DB_PORT: 5432
      DB_NAME: ${PERMISSION_DB_NAME}
      DB_USER: ${PERMISSION_DB_USER}
      DB_PASSWORD: ${PERMISSION_DB_PASSWORD}
    depends_on:
      permission-db:
        condition: service_healthy
    restart: unless-stopped

  permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PERMISSION_DB_NAME}
      POSTGRES_USER: ${PERMISSION_DB_USER}
      POSTGRES_PASSWORD: ${PERMISSION_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - permission-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  language-service:
    image: ghcr.io/ingsis-2026/language-service:${IMAGE_TAG}
    ports:
      - "${LANGUAGE_SERVICE_PORT:-8082}:8080"
    environment:
      SERVER_PORT: 8080
    restart: unless-stopped

volumes:
  snippet-data:
  permission-data:
  azurite-data:
  redis-data:
