# Snippet Searcher: todos los servicios y sus bases de datos en un solo compose.
# Las imágenes de los servicios las publica el CD de cada repo en ghcr.io/ingsis-2026, a partir de su Dockerfile.
# IMAGE_TAG (en el .env) elige cuáles se levantan: dev o prod.

services:

  snippet-service:
    image: ghcr.io/ingsis-2026/snippet-service:${IMAGE_TAG}
    ports:
      - "8080:8080"
    environment:
      DB_HOST: snippet-db
      DB_PORT: 5432
      DB_NAME: ${SNIPPET_DB_NAME}
      DB_USER: ${SNIPPET_DB_USER}
      DB_PASSWORD: ${SNIPPET_DB_PASSWORD}
      PERMISSION_URL: http://permission-service:8080
      LANGUAGE_URL: http://language-service:8080
    depends_on:
      snippet-db:
        condition: service_healthy
    restart: unless-stopped

  snippet-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SNIPPET_DB_NAME}
      POSTGRES_USER: ${SNIPPET_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPET_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - snippet-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  permission-service:
    image: ghcr.io/ingsis-2026/permission-service:${IMAGE_TAG}
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: permission-db
      DB_PORT: 5432
      DB_NAME: ${PERMISSION_DB_NAME}
      DB_USER: ${PERMISSION_DB_USER}
      DB_PASSWORD: ${PERMISSION_DB_PASSWORD}
    depends_on:
      permission-db:
        condition: service_healthy
    restart: unless-stopped

  permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PERMISSION_DB_NAME}
      POSTGRES_USER: ${PERMISSION_DB_USER}
      POSTGRES_PASSWORD: ${PERMISSION_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - permission-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  language-service:
    image: ghcr.io/ingsis-2026/language-service:${IMAGE_TAG}
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
    restart: unless-stopped

volumes:
  snippet-data:
  permission-data:
